<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Echo</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: #05060a;
}

body {
    position: relative;
}

/* Animated background */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 15%, rgba(76,110,255,.22), transparent 32%),
        radial-gradient(circle at 85% 25%, rgba(174,67,255,.18), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(0,210,255,.12), transparent 35%),
        linear-gradient(145deg,#05060a,#0b0d15 55%,#05060a);
}

.orb {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .22;
    animation: float 12s ease-in-out infinite;
}

.orb.one {
    background: #526dff;
    top: -80px;
    left: -80px;
}

.orb.two {
    background: #b44cff;
    right: -100px;
    top: 25%;
    animation-delay: -4s;
}

.orb.three {
    background: #00d9ff;
    bottom: -120px;
    left: 30%;
    animation-delay: -8s;
}

@keyframes float {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(35px,-25px) scale(1.12);
    }
}

/* Main */

#home {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 52px 22px 25px;
    display: flex;
    flex-direction: column;
    z-index: 2;
}

.clock {
    text-align: center;
    font-size: clamp(58px,17vw,100px);
    line-height: .95;
    font-weight: 300;
    letter-spacing: -5px;
    text-shadow: 0 10px 40px rgba(0,0,0,.4);
}

.date {
    text-align: center;
    margin-top: 10px;
    color: rgba(255,255,255,.68);
    font-size: 15px;
    letter-spacing: .6px;
}

.greeting {
    margin-top: 32px;
    font-size: 24px;
    font-weight: 600;
    text-align: center;
}

/* Search */

.search {
    margin: 25px auto 0;
    width: min(520px,100%);
    height: 58px;
    border-radius: 30px;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.11);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    display: flex;
    align-items: center;
    padding: 0 20px;
    box-shadow:
        0 12px 40px rgba(0,0,0,.22),
        inset 0 1px rgba(255,255,255,.08);
}

.search span {
    font-size: 21px;
    opacity: .65;
    margin-right: 12px;
}

.search input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
}

.search input::placeholder {
    color: rgba(255,255,255,.48);
}

/* Favorite apps */

.favorites {
    margin-top: auto;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 18px;
    width: min(440px,100%);
    margin-left: auto;
    margin-right: auto;
    padding-bottom: 18px;
}

.app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    user-select: none;
}

.icon {
    width: 64px;
    height: 64px;
    border-radius: 19px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.28);
    transition: transform .18s ease;
}

.icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.icon:active {
    transform: scale(.86);
}

.app-name {
    font-size: 11px;
    color: rgba(255,255,255,.75);
    max-width: 76px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* Bottom dock */

.dock {
    width: min(500px,100%);
    min-height: 78px;
    margin: 0 auto;
    border-radius: 30px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow:
        0 18px 55px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.08);
}

.dock .icon {
    width: 53px;
    height: 53px;
    border-radius: 17px;
}

/* Drawer */

#drawer {
    position: fixed;
    inset: 0;
    z-index: 10;
    transform: translateY(105%);
    transition: transform .42s cubic-bezier(.22,.8,.2,1);
    background:
        radial-gradient(circle at 50% 0%,rgba(89,111,255,.18),transparent 40%),
        rgba(5,6,10,.96);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 45px 20px 25px;
}

#drawer.open {
    transform: translateY(0);
}

.drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.drawer-title {
    font-size: 27px;
    font-weight: 700;
}

.close {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 20px;
}

.drawer-search {
    height: 52px;
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.08);
    color: white;
    outline: none;
    padding: 0 20px;
    width: 100%;
    margin-bottom: 20px;
    font-size: 16px;
}

.apps-grid {
    height: calc(100% - 145px);
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 24px 10px;
    padding: 5px 2px 50px;
}

.apps-grid::-webkit-scrollbar {
    display: none;
}

.drawer-app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: appear .35s ease both;
}

.drawer-app .icon {
    width: 65px;
    height: 65px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Hint */

.swipe-hint {
    text-align: center;
    color: rgba(255,255,255,.28);
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 8px;
}

/* Small screens */

@media(max-height:650px) {
    #home {
        padding-top: 25px;
    }

    .greeting {
        margin-top: 18px;
    }

    .favorites {
        margin-top: 15px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<!-- HOME -->

<div id="home">

    <div class="clock" id="clock">12:00</div>

    <div class="date" id="date">
        Loading...
    </div>

    <div class="greeting" id="greeting">
        Welcome to Echo
    </div>

    <div class="search">
        <span>⌕</span>
        <input
            id="homeSearch"
            type="text"
            placeholder="Search apps"
            autocomplete="off">
    </div>

    <div class="favorites" id="favorites"></div>

    <div class="dock" id="dock"></div>

    <div class="swipe-hint">
        SWIPE UP FOR APPS
    </div>

</div>

<!-- APP DRAWER -->

<div id="drawer">

    <div class="drawer-header">

        <div class="drawer-title">
            All Apps
        </div>

        <button class="close" onclick="closeDrawer()">
            ×
        </button>

    </div>

    <input
        class="drawer-search"
        id="drawerSearch"
        type="text"
        placeholder="Search apps..."
        autocomplete="off">

    <div class="apps-grid" id="appsGrid"></div>

</div>

<script>

let apps = [];
let startY = 0;
let endY = 0;

/* Clock */

function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2,"0");

    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12 || 12;

    document.getElementById("clock").textContent =
        hours + ":" + minutes;

    document.getElementById("date").textContent =
        now.toLocaleDateString(undefined,{
            weekday:"long",
            month:"long",
            day:"numeric"
        });

    const h = now.getHours();

    let greeting = "Good evening";

    if(h < 12)
        greeting = "Good morning";

    else if(h < 18)
        greeting = "Good afternoon";

    document.getElementById("greeting").textContent =
        greeting + " • Echo";
}

setInterval(updateClock,1000);
updateClock();


/* Receive apps from Java */

function receiveApps(json) {

    try {

        apps = JSON.parse(json);

        apps.sort((a,b) =>
            a.name.localeCompare(b.name)
        );

        renderDrawer(apps);
        renderHome();

    } catch(e) {

        console.log("App loading error",e);

    }
}


/* Create app element */

function createApp(app, drawer=false) {

    const element =
        document.createElement("div");

    element.className =
        drawer ? "drawer-app" : "app";

    element.innerHTML = `

        <div class="icon">
            <img src="data:image/png;base64,${app.icon}">
        </div>

        <div class="app-name">
            ${escapeHtml(app.name)}
        </div>

    `;

    element.onclick = function() {

        if(window.Android) {

            Android.launchApp(app.package);

        }

    };

    return element;
}


/* Home apps */

function renderHome() {

    const favorites =
        document.getElementById("favorites");

    const dock =
        document.getElementById("dock");

    favorites.innerHTML = "";
    dock.innerHTML = "";

    const selected = apps.slice(0,4);

    selected.forEach(app => {

        favorites.appendChild(
            createApp(app)
        );

    });

    const dockApps = apps.slice(0,5);

    dockApps.forEach(app => {

        const el = createApp(app);

        const icon =
            el.querySelector(".icon");

        const name =
            el.querySelector(".app-name");

        if(name)
            name.style.display = "none";

        dock.appendChild(el);

    });
}


/* Drawer */

function renderDrawer(list) {

    const grid =
        document.getElementById("appsGrid");

    grid.innerHTML = "";

    list.forEach((app,index) => {

        const el =
            createApp(app,true);

        el.style.animationDelay =
            Math.min(index * .015,.3) + "s";

        grid.appendChild(el);

    });
}


/* Search */

document
.getElementById("drawerSearch")
.addEventListener("input",function(){

    const q =
        this.value.toLowerCase();

    const filtered =
        apps.filter(app =>
            app.name.toLowerCase().includes(q)
        );

    renderDrawer(filtered);

});


document
.getElementById("homeSearch")
.addEventListener("focus",function(){

    openDrawer();

    setTimeout(() => {

        document
        .getElementById("drawerSearch")
        .focus();

    },350);

});


/* Drawer controls */

function openDrawer() {

    document
    .getElementById("drawer")
    .classList.add("open");

}

function closeDrawer() {

    document
    .getElementById("drawer")
    .classList.remove("open");

}


/* Swipe gestures */

document.addEventListener("touchstart",function(e){

    startY =
        e.touches[0].clientY;

});

document.addEventListener("touchend",function(e){

    endY =
        e.changedTouches[0].clientY;

    const distance =
        endY - startY;

    if(Math.abs(distance) < 70)
        return;

    if(distance < 0) {

        openDrawer();

    } else {

        closeDrawer();

    }

});


/* Escape HTML */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* Ask Java for installed apps */

if(window.Android) {

    Android.getApps();

}

</script>

</body>
</html>
